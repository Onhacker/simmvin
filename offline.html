<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a89dc">
  <meta name="robots" content="noindex, nofollow">
  <title>MVIN sedang offline</title>
  <link rel="icon" type="image/png" sizes="192x192" href="assets/pwa/icon-192.png">
  <style>
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); background: #eef2f6; color: #111827; }
    main { width: min(100%, 430px); padding: 32px 26px; border-radius: 24px; background: #fff; box-shadow: 0 18px 45px rgba(36, 89, 166, .13); text-align: center; }
    img { width: 112px; height: 112px; border-radius: 24px; object-fit: contain; }
    .eyebrow { margin: 20px 0 2px; color: #2459a6; font-size: 14px; font-weight: 800; }
    h1 { margin: 0 0 12px; font-size: clamp(27px, 8vw, 34px); line-height: 1.12; }
    p { margin: 0 0 24px; color: #4b5563; font-size: 16px; line-height: 1.65; }
    button { width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: linear-gradient(#3e7ac2, #2459a6); color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    button:focus-visible { outline: 3px solid rgba(36, 89, 166, .35); outline-offset: 3px; }
    small { display: block; margin-top: 15px; color: #6b7280; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <img src="assets/pwa/icon-192.png" alt="Logo MVIN">
    <div class="eyebrow">Koneksi terputus</div>
    <h1>MVIN sedang offline</h1>
    <p>Hubungkan perangkat ke internet untuk membuka data event, peserta, dan keuangan terbaru.</p>
    <button type="button" onclick="window.location.reload()">Coba Lagi</button>
    <small>Demi keamanan, data transaksi dan peserta tidak disimpan sebagai halaman offline.</small>
  </main>
</body>
</html>
